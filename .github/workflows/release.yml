name: Release

# 推送 v* 标签时自动构建并发布，也可以在 Actions 页面手动触发。
#
# 只产出自包含的单文件绿色版 DLSSGManager.exe，以及 SHA256SUMS.txt。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 构建
        shell: pwsh
        run: |
          dotnet build -c Release --nologo

      - name: 解析版本号
        id: version
        shell: pwsh
        run: |
          # 标签形如 v1.2.3 时取版本号；手动触发则用 csproj 里的值。
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            [xml]$project = Get-Content src/DLSSGManager/DLSSGManager.csproj
            $v = [string]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Output "版本: $v"

      - name: 发布绿色版 exe
        shell: pwsh
        run: |
          # 自包含：目标机器无需安装 .NET 运行时，双击即可用。
          dotnet publish src/DLSSGManager/DLSSGManager.csproj `
            -c Release -p:PublishProfile=Portable `
            -p:Version=${{ steps.version.outputs.value }} `
            --nologo

      - name: 生成校验值
        shell: pwsh
        run: |
          $files = @('publish/DLSSGManager.exe')

          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash
            "{0}  {1}" -f $hash, (Split-Path $f -Leaf)
          }
          $lines | Out-File -Encoding ascii publish/SHA256SUMS.txt

          Get-Content publish/SHA256SUMS.txt
          foreach ($f in $files) {
            "{0}: {1:N1} MB" -f (Split-Path $f -Leaf), ((Get-Item $f).Length / 1MB) | Write-Output
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DLSSGManager-${{ steps.version.outputs.value }}
          path: |
            publish/DLSSGManager.exe
            publish/SHA256SUMS.txt

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/DLSSGManager.exe
            publish/SHA256SUMS.txt
          name: ${{ github.ref_name }}
          body_path: docs/RELEASE-NOTES.md

