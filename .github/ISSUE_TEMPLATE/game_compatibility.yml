name: 游戏兼容性反馈 / Game compatibility
description: 报告某款游戏能用或不能用，帮助完善兼容性记录 / Report whether a game works, to build up the compatibility record
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        这个模板收集游戏的实测结果，成功和失败都有价值——尤其**失败**的案例能帮其他人少走弯路。
        This template collects game compatibility reports. Both outcomes are valuable — **failures** especially,
        since they save others the trouble.

  - type: input
    id: game
    attributes:
      label: 游戏名称 / Game
      placeholder: 例如 / e.g. Cyberpunk 2077
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: 结果 / Result
      options:
        - 成功 —— 帧生成正常工作 / Works — frame generation is fine
        - 失败 —— 游戏报错或崩溃 / Fails — the game errors or crashes
        - 失败 —— 被反作弊拦截 / Fails — blocked by anti-cheat
        - 失败 —— 有画面问题（闪烁、残影等） / Fails — visual artifacts (flicker, ghosting)
        - 部分可用 —— 能跑但有明显问题 / Partial — runs but with clear problems
    validations:
      required: true

  - type: dropdown
    id: anticheat
    attributes:
      label: 程序检测到的反作弊 / Anti-cheat reported by the manager
      description: 选中游戏时配置面板顶部会显示（没有提示说明未检测到） / Shown at the top of the detail panel; nothing shown means none detected
      options:
        - 未检测到反作弊 / None detected
        - 检测到内核级反作弊（程序禁止部署） / Kernel-level detected (deployment blocked)
        - 不确定 / 没注意 / Not sure
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: 详细情况 / Details
      description: |
        如果成功：帧率提升多少？用的什么倍率和分辨率？
        如果失败：具体现象、报错文字、日志内容
        If it works: how much did the frame rate improve, at what multiplier and resolution?
        If it fails: the symptom, any error text, and the log contents.
    validations:
      required: true

  - type: input
    id: settings
    attributes:
      label: 管理器里的配置 / Settings in the manager
      description: 显卡路由、内核镜像、倍率上限、是否开启近似采样 / Route, kernel image, frame multiplier, approximate sampling
      placeholder: 例如 / e.g. SM86 / PTX / 4X / sampling off
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: 显卡与驱动版本 / GPU and driver
      placeholder: 例如 / e.g. RTX 3080 Ti / 591.86
    validations:
      required: true

  - type: input
    id: output-resolution
    attributes:
      label: 输出分辨率与 DLSS 档位 / Output resolution and DLSS mode
      description: 显存占用与输出分辨率直接相关 / VRAM overhead scales with output resolution
      placeholder: 例如 / e.g. 2560×1440 / DLSS Balanced
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 管理器版本 / Manager version
      placeholder: 例如 / e.g. 1.4.0
    validations:
      required: true
